name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          npm run release:check -- "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }
          "version=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build MSI and NSIS installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles msi,nsis
          uploadUpdaterJson: false

      - name: Stage release assets
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP "release-assets"
          $assetDir = & ./scripts/stage-release-assets.ps1 `
            -Version $env:VERSION `
            -Destination $assetDir
          "asset_dir=$assetDir" >> $env:GITHUB_OUTPUT

      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $releaseJson = gh release view $env:TAG_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $env:TAG_NAME is already published; refusing to replace its assets."
            }
          } else {
            gh release create $env:TAG_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --draft `
              --generate-notes `
              --title "Luma Palette $env:TAG_NAME"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create draft release $env:TAG_NAME."
            }
          }

          $assetFiles = Get-ChildItem -LiteralPath $env:ASSET_DIR -File |
            Select-Object -ExpandProperty FullName
          gh release upload $env:TAG_NAME @assetFiles `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload release assets for $env:TAG_NAME."
          }
